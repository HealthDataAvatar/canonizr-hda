[project]
name = "canonizr-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128",
    "uvicorn==0.40.0",
    "python-magic==0.4.27",
    "httpx==0.28.0",
    "python-multipart==0.0.9",
    "Pillow==11.2.1",
    "pillow-heif==0.21.0",
    "markitdown[all]",
    "pymupdf",
    "extract-msg",
    "xxhash",
    "redis[hiredis]>=5.0",
    "cryptography>=44.0",
    "stripe>=12.0",
    "azure-monitor-query>=1.3",
    "azure-identity>=1.17",
    "azure-data-tables>=12.5",
    "azure-storage-blob[aio]>=12.20",
    "aiohttp>=3.9",
    "posthog>=7.16.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout",
    "pytest-html",
    "pytest-cov",
    "requests",
    "python-docx",
    "openpyxl",
    "reportlab",
]
lint = [
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "focus: only run this test when FOCUS_TESTS=1 is set",
    "integration: requires docker-compose services",
]
