[project]
name = "canonizr-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128",
    "uvicorn==0.40.0",
    "python-magic==0.4.27",
    "httpx==0.28.0",
    "python-multipart==0.0.9",
    "Pillow==11.2.1",
    "pillow-heif==0.21.0",
    "markitdown[all]",
    "pymupdf",
    "extract-msg",
    "xxhash",
    "redis[hiredis]>=5.0",
    "cryptography>=44.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-html",
    "requests",
    "python-docx",
    "openpyxl",
    "reportlab",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "focus: only run this test when FOCUS_TESTS=1 is set",
    "integration: requires docker-compose services",
]
